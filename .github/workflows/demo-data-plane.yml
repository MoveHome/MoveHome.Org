name: Demo data plane isolation

# Must-fail isolation fixtures for the expo demo plane (supabase/demo-fixtures).
# Each fixture asserts a forbidden operation is rejected, so a green run means
# every guard held. Reports BLOCKED (green) until the demo project exists.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  must-fail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Must-fail fixtures
        env:
          DEMO_SUPABASE_DB_URL: ${{ secrets.DEMO_SUPABASE_DB_URL }}
        run: npm run test:demo

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Consent, moderation and retract unit gates
        run: npm test
      - name: Typecheck
        run: npm run typecheck
